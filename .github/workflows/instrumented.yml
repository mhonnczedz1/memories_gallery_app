name: Instrumented tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Only modules that have instrumented tests (src/androidTest) run on the managed devices.
      - name: Instrumented tests on the ci device group
        run: |
          tasks=$(find . -path ./build -prune -o -type d -path '*/src/androidTest' -print \
            | sed -E 's#^\./##; s#/src/androidTest$##; s#/#:#g; s#^#:#; s#$#:ciGroupDebugAndroidTest#' \
            | sort)
          if [ -z "$tasks" ]; then
            echo "No modules have instrumented tests yet."
            exit 0
          fi
          ./gradlew $tasks -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
