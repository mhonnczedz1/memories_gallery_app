name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Base check (plan E2.6). T0.3 adds :app:verifyPrivacy once the task exists.
      - name: Base check
        run: ./gradlew spotlessCheck lint :core:test testDebugUnitTest

      - name: Release build (unsigned)
        run: ./gradlew :app:assembleRelease

      - name: Feature list matches the plan
        run: python3 -I tools/check-features.py

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
